<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meal Search</title>
<link rel="stylesheet" href="MEAL.css">
</head>

<body>

<header>

<div class="brand-mark">
The Kitchen Recipe
</div>

<h1>Find your Meal</h1>

<div class="search-card">

<input 
type="text" 
id="searchInput"
placeholder="Try chicken, pasta, curry..."
aria-label="Search for a meal">

<button id="searchBtn">
Search
</button>

</div>

<div class="hint">
Real food Real flavors Real stories from real kitchens.
These recipes have stood the test of time because they simply work.
</div>

</header>


<main>

<div id="status"></div>

<div id="results"></div>


<div id="showAllWrap" hidden>

<button id="showAllBtn">
Show All Results
</button>

</div>

</main>


<footer>

Recipes sourced from

<a href="https://www.themealdb.com" target="_blank">
TheMealDB
</a>
Timeless dishes for the modern kitchen
</footer>

<script src="MEAL.js"></script>

</body>
</html>
